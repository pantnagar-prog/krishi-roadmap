server {
    # Port 8080 (not 80) so the container can run as a non-root user.
    # (No `listen [::]:8080` — Docker's default bridge network has no IPv6,
    #  and nginx aborts at startup if it can't open the socket.)
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Sensible security headers for a static, dependency-free page.
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml;

    # NOTE: nginx's `add_header` does NOT merge — an `add_header` inside a
    # location silently drops every header inherited from the server block.
    # So the locations below use `expires` only, and the security headers
    # above keep applying to every response.

    # HTML is revalidated every time, so edits show up immediately.
    location = /index.html {
        expires -1;                # => Cache-Control: no-cache
    }

    # Images and fonts are safe to cache. Not `immutable`: the filenames are
    # not content-hashed, so a replaced logo must still be able to win.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;               # => Cache-Control: max-age=2592000
    }

    # Liveness probe used by HEALTHCHECK / orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
